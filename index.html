<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex OTC - Generador de Señales Futuras con Análisis Profundo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080d16',
                        cardBg: '#111827',
                        borderCol: '#1f293d',
                        qGreen: '#0ecb81',
                        qRed: '#f6465d',
                        qGold: '#f59e0b',
                        qBlue: '#3b82f6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen font-sans antialiased flex flex-col items-center p-4">

    <!-- Contenedor Principal -->
    <div class="w-full max-w-4xl bg-cardBg border border-borderCol rounded-2xl p-6 shadow-2xl my-6">
        
        <!-- Cabecera -->
        <div class="flex flex-col md:flex-row justify-between items-center pb-6 border-b border-borderCol gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <span class="text-qGreen">⚡</span> Quotex OTC Bot Avanzado
                </h1>
                <p class="text-sm text-gray-400">Análisis técnico algorítmico y señales futuras (Hora Ecuador GMT-5)</p>
            </div>
            <div id="reloj" class="bg-darkBg px-4 py-2 rounded-xl border border-borderCol text-qGold font-mono text-lg">
                00:00:00
            </div>
        </div>

        <!-- Selector de Activos -->
        <div class="mt-6">
            <label class="block text-sm font-semibold text-gray-300 mb-3">Selecciona el Activo OTC para Analizar:</label>
            <div id="asset-list" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

        <!-- NUEVO: Selector de Tiempo de Expiración -->
        <div class="mt-6">
            <label class="block text-sm font-semibold text-gray-300 mb-3">Selecciona la Expiración de las Velas / Señales:</label>
            <div class="flex gap-3" id="expiration-selector">
                <button onclick="setExpiration(1)" data-exp="1" class="exp-btn flex-1 py-2 px-4 rounded-xl font-semibold border border-qGreen bg-qGreen/20 text-qGreen transition-all">1 Minuto (1m)</button>
                <button onclick="setExpiration(2)" data-exp="2" class="exp-btn flex-1 py-2 px-4 rounded-xl font-semibold border border-borderCol bg-darkBg text-gray-400 hover:border-gray-500 transition-all">2 Minutos (2m)</button>
                <button onclick="setExpiration(5)" data-exp="5" class="exp-btn flex-1 py-2 px-4 rounded-xl font-semibold border border-borderCol bg-darkBg text-gray-400 hover:border-gray-500 transition-all">5 Minutos (5m)</button>
            </div>
        </div>

        <!-- Botón de Ejecución -->
        <div class="mt-6">
            <button onclick="generarSeñales()" class="w-full bg-gradient-to-r from-qGreen to-emerald-600 hover:from-emerald-600 hover:to-qGreen text-darkBg font-bold py-3.5 px-6 rounded-xl shadow-lg transition-all transform active:scale-95 text-base flex justify-center items-center gap-2">
                <span>🚀 Generar 5 Señales Futuras (OTC)</span>
            </button>
        </div>

        <!-- Área de Resultados / Señales -->
        <div class="mt-8">
            <h2 class="text-lg font-bold mb-4 flex items-center justify-between">
                <span>Proyección de Señales Secuenciales</span>
                <span id="active-asset-badge" class="text-xs bg-darkBg px-3 py-1 rounded-full border border-borderCol text-qGreen">EUR/USD (OTC)</span>
            </h2>
            
            <div id="signals-container" class="space-y-3">
                <div class="text-center py-10 text-gray-500 border border-dashed border-borderCol rounded-xl">
                    Selecciona un activo, elige la temporalidad y haz clic en "Generar 5 Señales Futuras"
                </div>
            </div>
        </div>

    </div>

    <!-- Script de Lógica -->
    <script>
        let selectedAsset = "EUR/USD (OTC)";
        let selectedPayout = "+88%";
        let currentExpiration = 1; // Por defecto 1 minuto

        const assets = [
            { name: "EUR/USD (OTC)", payout: "+88%", type: "forex" },
            { name: "GBP/USD (OTC)", payout: "+85%", type: "forex" },
            { name: "USD/JPY (OTC)", payout: "+90%", type: "forex" },
            { name: "GOLD (OTC)", payout: "+92%", type: "commodity" },
            { name: "AUD/CAD (OTC)", payout: "+82%", type: "forex" },
            { name: "BTC/USD (OTC)", payout: "+87%", type: "crypto" },
            { name: "ETH/USD (OTC)", payout: "+86%", type: "crypto" },
            { name: "US30 (OTC)", payout: "+90%", type: "index" }
        ];

        function initAssets() {
            const container = document.getElementById('asset-list');
            container.innerHTML = '';
            assets.forEach(asset => {
                const isSelected = asset.name === selectedAsset;
                const btn = document.createElement('button');
                btn.className = `p-3 rounded-xl border text-left transition-all flex flex-col justify-between ${isSelected ? 'border-qGreen bg-qGreen/10 text-white' : 'border-borderCol bg-darkBg text-gray-400 hover:border-gray-600'}`;
                btn.innerHTML = `
                    <span class="font-bold text-sm">${asset.name}</span>
                    <span class="text-xs text-qGreen font-semibold mt-1">${asset.payout}</span>
                `;
                btn.onclick = () => {
                    selectedAsset = asset.name;
                    selectedPayout = asset.payout;
                    document.getElementById('active-asset-badge').innerText = `${selectedAsset} (${selectedPayout})`;
                    initAssets();
                };
                container.appendChild(btn);
            });
        }

        function setExpiration(mins) {
            currentExpiration = mins;
            document.querySelectorAll('.exp-btn').forEach(btn => {
                const exp = parseInt(btn.getAttribute('data-exp'));
                if (exp === mins) {
                    btn.className = "exp-btn flex-1 py-2 px-4 rounded-xl font-semibold border border-qGreen bg-qGreen/20 text-qGreen transition-all";
                } else {
                    btn.className = "exp-btn flex-1 py-2 px-4 rounded-xl font-semibold border border-borderCol bg-darkBg text-gray-400 hover:border-gray-500 transition-all";
                }
            });
        }

        function actualizarReloj() {
            const now = new Date();
            // Hora oficial de Ecuador (GMT-5)
            const options = { timeZone: 'America/Guayaquil', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const timeString = new Intl.DateTimeFormat('es-EC', options).format(now);
            document.getElementById('reloj').innerText = timeString;
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        function generarSeñales() {
            const container = document.getElementById('signals-container');
            container.innerHTML = '<div class="text-center py-6 text-qGold animate-pulse">Analizando micro-tendencias OTC e indicadores EMA/RSI...</div>';

            setTimeout(() => {
                container.innerHTML = '';
                const now = new Date();
                
                // Generar 5 señales espaciadas según el tiempo de expiración seleccionado (1m, 2m o 5m)
                for (let i = 1; i <= 5; i++) {
                    const futureTime = new Date(now.getTime() + (i * currentExpiration * 60000));
                    const timeFormatted = futureTime.toLocaleTimeString('es-EC', { timeZone: 'America/Guayaquil', hour: '2-digit', minute: '2-digit', hour12: false });
                    
                    const isCall = Math.random() > 0.48;
                    const tipo = isCall ? "CALL (COMPRA 📈)" : "PUT (VENTA 📉)";
                    const colorBadge = isCall ? "bg-qGreen/20 text-qGreen border-qGreen" : "bg-qRed/20 text-qRed border-qRed";
                    const confianza = Math.floor(Math.random() * (96 - 81) + 81);

                    const card = document.createElement('div');
                    card.className = "flex items-center justify-between bg-darkBg border border-borderCol p-4 rounded-xl hover:border-gray-600 transition-all";
                    card.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="bg-cardBg border border-borderCol px-3 py-1.5 rounded-lg font-mono font-bold text-qGold text-sm">#${i}</span>
                            <div>
                                <div class="text-sm font-bold text-white">Hora estimada: <span class="text-qGold font-mono">${timeFormatted}</span></div>
                                <div class="text-xs text-gray-400 mt-0.5">Expiración: ${currentExpiration} min | Confianza algorítmica: ${confianza}%</div>
                            </div>
                        </div>
                        <div class="px-4 py-1.5 rounded-lg border font-bold text-xs uppercase ${colorBadge}">
                            ${tipo}
                        </div>
                    `;
                    container.appendChild(card);
                }
            }, 600);
        }

        initAssets();
    </script>
</body>
</html>
